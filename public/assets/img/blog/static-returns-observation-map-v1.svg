<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Three observation points after ionization</title>
<desc id="desc">Logical material flow from A, after ionization and before the next contact, through a contact and separation step, to B, after separation, and then C, before the affected step. This is a process observation map, not a machine installation drawing.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfe"/><stop offset="1" stop-color="#eaf1f7"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#18364e" flood-opacity="0.07"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#2189a8" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1000" fill="url(#background)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <rect x="100" y="178" width="40" height="5" rx="2.5" fill="#23a6c6"/>
  <text x="158" y="190" font-size="25" font-weight="700" letter-spacing="3" fill="#40627a">OBSERVATION MAP</text>
  <text x="100" y="267" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#122e4a">Follow the next material step</text>

  <g fill="none" stroke="#2189a8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M430 500 H469"/>
    <path d="M710 500 H749"/>
    <path d="M1100 500 H1139"/>
  </g>

  <g filter="url(#shadow)" fill="#ffffff" stroke="#dae5ee" stroke-width="2">
    <rect x="100" y="342" width="310" height="316" rx="25"/>
    <rect x="770" y="342" width="310" height="316" rx="25"/>
    <rect x="1160" y="342" width="310" height="316" rx="25"/>
  </g>
  <g fill="#12344f">
    <rect x="221" y="381" width="68" height="68" rx="18"/>
    <rect x="891" y="381" width="68" height="68" rx="18"/>
    <rect x="1281" y="381" width="68" height="68" rx="18"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-size="40" font-weight="700">
    <text x="255" y="429">A</text><text x="925" y="429">B</text><text x="1315" y="429">C</text>
  </g>
  <g text-anchor="middle" fill="#122e4a" font-size="38" font-weight="700" letter-spacing="-0.6">
    <text x="255" y="505">After</text><text x="255" y="551">ionization</text>
    <text x="925" y="505">After</text><text x="925" y="551">separation</text>
    <text x="1315" y="505">Before</text><text x="1315" y="551">affected step</text>
  </g>
  <text x="255" y="608" text-anchor="middle" font-size="24" fill="#5a7185">Before next contact</text>

  <rect x="490" y="402" width="200" height="196" rx="23" fill="#e0f3f8" stroke="#84c7da" stroke-width="2"/>
  <g text-anchor="middle" fill="#176b85" font-size="31" font-weight="700" letter-spacing="-0.3">
    <text x="590" y="477">Contact</text><text x="590" y="514">/</text><text x="590" y="551">separation</text>
  </g>

  <text x="100" y="756" font-size="27" font-weight="700" fill="#47657a">Material travel</text>
  <path d="M315 747 H1468" fill="none" stroke="#86b8c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="833" font-size="25" fill="#6b7e8c">Logical process flow · not an equipment layout</text>
</g>
</svg>