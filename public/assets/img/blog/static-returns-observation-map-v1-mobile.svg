<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
<title id="title">Three observation points after ionization, mobile layout</title>
<desc id="desc">Logical material flow runs downwards from A, after ionization and before next contact, through contact and separation, to B, after separation, then C, before the affected step. This is a process map, not an equipment layout.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfe"/><stop offset="1" stop-color="#eaf1f7"/></linearGradient>
  <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#18364e" flood-opacity="0.07"/></filter>
  <marker id="arrow" markerWidth="20" markerHeight="20" refX="15" refY="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M5 3 L15 10 L5 17" fill="none" stroke="#2189a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="800" height="1200" fill="url(#background)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <rect x="48" y="47" width="28" height="5" rx="2.5" fill="#23a6c6"/>
  <text x="96" y="62" font-size="32" font-weight="700" letter-spacing="2" fill="#40627a">OBSERVATION MAP</text>
  <g font-size="48" font-weight="700" letter-spacing="-1" fill="#122e4a">
    <text x="48" y="125">Follow the next</text>
    <text x="48" y="182">material step</text>
  </g>

  <g filter="url(#shadow)" fill="#ffffff" stroke="#dae5ee" stroke-width="2">
    <rect x="48" y="224" width="704" height="168" rx="23"/>
    <rect x="48" y="608" width="704" height="168" rx="23"/>
    <rect x="48" y="826" width="704" height="168" rx="23"/>
  </g>
  <g fill="#12344f">
    <rect x="80" y="268" width="80" height="80" rx="19"/>
    <rect x="80" y="652" width="80" height="80" rx="19"/>
    <rect x="80" y="870" width="80" height="80" rx="19"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-size="46" font-weight="700">
    <text x="120" y="324">A</text><text x="120" y="708">B</text><text x="120" y="926">C</text>
  </g>
  <g fill="#122e4a" font-size="40" font-weight="700" letter-spacing="-0.5">
    <text x="192" y="291">After ionization</text>
    <text x="192" y="706">After separation</text>
    <text x="192" y="924">Before affected step</text>
  </g>
  <text x="192" y="340" font-size="32" fill="#5a7185">Before next contact</text>

  <rect x="160" y="442" width="480" height="116" rx="22" fill="#e0f3f8" stroke="#84c7da" stroke-width="2"/>
  <text x="400" y="513" text-anchor="middle" fill="#176b85" font-size="36" font-weight="700" letter-spacing="-0.3">Contact / separation</text>

  <g fill="none" stroke="#2189a8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M400 403 V429"/>
    <path d="M400 569 V595"/>
    <path d="M400 787 V813"/>
  </g>
  <g text-anchor="middle" font-size="32" fill="#657b8c">
    <text x="400" y="1080">Logical process flow</text>
    <text x="400" y="1124">Not an equipment layout</text>
  </g>
</g>
</svg>